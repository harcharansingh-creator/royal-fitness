<nav
  class="navbar"
  [class.scrolled]="isScrolled"
>

  <div class="navbar-container">

    <!-- Logo -->

    <a
      href="#home"
      class="logo"
      (click)="closeMenu()"
    >

      <span class="logo-main">
        ROYAL
      </span>

      <span class="logo-sub">
        FITNESS
      </span>

    </a>


    <!-- Desktop Navigation -->

    <div class="nav-links">

      <a
        href="#home"
        [class.active]="activeSection === 'home'"
      >
        Home
      </a>

      <a
        href="#about"
        [class.active]="activeSection === 'about'"
      >
        About
      </a>

      <a
        href="#services"
        [class.active]="activeSection === 'services'"
      >
        Services
      </a>

      <a
        href="#pricing"
        [class.active]="activeSection === 'pricing'"
      >
        Pricing
      </a>

      <a
        href="#gallery"
        [class.active]="activeSection === 'gallery'"
      >
        Gallery
      </a>

      <a
        href="#contact"
        [class.active]="activeSection === 'contact'"
      >
        Contact
      </a>

    </div>


    <!-- Join Button -->

    <a
      href="#contact"
      class="join-btn"
    >
      JOIN NOW

      <span>↗</span>
    </a>


    <!-- Mobile Menu Button -->

    <button
      type="button"
      class="menu-btn"
      [class.open]="menuOpen"
      (click)="toggleMenu()"
      aria-label="Toggle navigation menu"
    >

      <span></span>
      <span></span>
      <span></span>

    </button>

  </div>


  <!-- Mobile Menu -->

  <div
    class="mobile-menu"
    [class.open]="menuOpen"
  >

    <a
      href="#home"
      [class.active]="activeSection === 'home'"
      (click)="closeMenu()"
    >
      Home
    </a>

    <a
      href="#about"
      [class.active]="activeSection === 'about'"
      (click)="closeMenu()"
    >
      About
    </a>

    <a
      href="#services"
      [class.active]="activeSection === 'services'"
      (click)="closeMenu()"
    >
      Services
    </a>

    <a
      href="#pricing"
      [class.active]="activeSection === 'pricing'"
      (click)="closeMenu()"
    >
      Pricing
    </a>

    <a
      href="#gallery"
      [class.active]="activeSection === 'gallery'"
      (click)="closeMenu()"
    >
      Gallery
    </a>

    <a
      href="#contact"
      [class.active]="activeSection === 'contact'"
      (click)="closeMenu()"
    >
      Contact
    </a>


    <a
      href="#contact"
      class="mobile-join"
      (click)="closeMenu()"
    >
      JOIN NOW ↗
    </a>

  </div>

</nav>
